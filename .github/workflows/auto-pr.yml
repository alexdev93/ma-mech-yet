name: Auto PR

# Every push to a branch other than main: run CI, then open (or reuse) a PR into main and merge it.
# Nothing merges unless CI passes.
on:
  push:
    branches-ignore: [main]

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      ENV_VAULT_TOKEN: ${{ secrets.ENV_VAULT_TOKEN }}

  merge:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # alexdev93's fine-grained PAT, so the PR is opened and merged as that user.
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: Require the GH_PAT secret
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a GH_PAT repository secret (fine-grained PAT: Contents, Pull requests and Workflows read/write) to enable auto-merge."
            exit 1
          fi

      - name: Open or reuse the pull request
        run: |
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            title=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]')
            gh pr create --head "$BRANCH" --base main --title "$title" \
              --body "Opened automatically for \`$BRANCH\` after CI passed on $SHA."
          fi

      # Merging as a user (not GITHUB_TOKEN) also triggers CI on main and on the PR as usual.
      # --match-head-commit refuses to merge if someone pushed again after this CI run.
      # A merge commit (not squash) keeps long-lived branches like dev in sync with main.
      - name: Merge
        run: gh pr merge "$BRANCH" --merge --match-head-commit "$SHA"
